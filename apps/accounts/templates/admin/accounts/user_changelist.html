{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li>
    <form method="post" action="purge-masters/" style="display:inline;"
          onsubmit="return confirm('Удалить ВСЕХ мастеров со всеми связями? Действие необратимо.');">
      {% csrf_token %}
      <button type="submit" class="button"
              style="background:#ba2121;color:#fff;border:none;">🧹 Удалить всех мастеров</button>
    </form>
  </li>
  <li>
    <form method="post" action="purge-clients/" style="display:inline;"
          onsubmit="return confirm('Удалить ВСЕХ клиентов со всеми связями? Действие необратимо.');">
      {% csrf_token %}
      <button type="submit" class="button"
              style="background:#ba2121;color:#fff;border:none;">🧹 Удалить всех клиентов</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
